<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Netflix Clone</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background-color:#111;
      color:white;
    }

    .banner{
      background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop') no-repeat center center/cover;
      height:100vh;
      position:relative;
    }

    .overlay{
      background:rgba(0,0,0,0.6);
      height:100%;
      width:100%;
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 50px;
    }

    .logo{
      color:red;
      font-size:38px;
      font-weight:bold;
    }

    .sign-btn{
      background:red;
      color:white;
      border:none;
      padding:10px 20px;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
    }

    .content{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      text-align:center;
      width:80%;
    }

    .content h1{
      font-size:60px;
      margin-bottom:20px;
    }

    .content h3{
      margin-bottom:20px;
      font-size:25px;
    }

    .content p{
      margin-bottom:20px;
      font-size:18px;
    }

    .email-box{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
    }

    .email-box input{
      padding:15px;
      width:350px;
      border:none;
      border-radius:5px;
      font-size:16px;
    }

    .email-box button{
      padding:15px 25px;
      background:red;
      color:white;
      border:none;
      border-radius:5px;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }

    .movies{
      padding:40px;
    }

    .movies h2{
      margin-bottom:20px;
    }

    .movie-row{
      display:flex;
      gap:15px;
      overflow-x:auto;
    }

    .movie-card{
      min-width:250px;
      height:150px;
      border-radius:10px;
      overflow:hidden;
      transition:0.3s;
      cursor:pointer;
    }

    .movie-card img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .movie-card:hover{
      transform:scale(1.08);
    }

    footer{
      text-align:center;
      padding:20px;
      color:gray;
    }

    @media(max-width:768px){

      .content h1{
        font-size:40px;
      }

      .content h3{
        font-size:20px;
      }

      nav{
        padding:20px;
      }

      .logo{
        font-size:28px;
      }

      .email-box input{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <div class="banner">
    <div class="overlay">

      <nav>
        <div class="logo">NETFLIX</div>
        <button class="sign-btn">Sign In</button>
      </nav>

      <div class="content">
        <h1>Unlimited movies, TV shows and more.</h1>

        <h3>Watch anywhere. Cancel anytime.</h3>

        <p>
          Ready to watch? Enter your email to create or restart your membership.
        </p>

        <div class="email-box">
          <input type="email" placeholder="Enter your email">
          <button onclick="showMessage()">Get Started ></button>
        </div>
      </div>

    </div>
  </div>

  <section class="movies">
    <h2>Popular Movies</h2>

    <div class="movie-row">

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=800&auto=format&fit=crop">
      </div>

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=800&auto=format&fit=crop">
      </div>

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=800&auto=format&fit=crop">
      </div>

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1478720568477-152d9b164e26?q=80&w=800&auto=format&fit=crop">
      </div>

    </div>
  </section>

  <footer>
    © 2026 Netflix Clone by Nikhil Patel
  </footer>

  <script>
    function showMessage(){
      alert("Welcome to Netflix Clone!");
    }
  </script>

</body>
</html>
